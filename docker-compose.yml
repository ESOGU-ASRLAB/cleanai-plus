version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: cleanai-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: cleanai_plus
    volumes:
      - mongodb_data:/data/db
    networks:
      - cleanai-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cleanai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=cleanai_plus
      - ENVIRONMENT=production
    depends_on:
      - mongodb
    networks:
      - cleanai-network
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cleanai-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - cleanai-network
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mongodb_data:

networks:
  cleanai-network:
    driver: bridge
